<!doctype html>
<!-- PROP THUMBNAILS — stage 1b of the prop catalogue.
     Served by `node scripts/serve-root.mjs`, driven by a browser script:
       window.show(url, sizeMetres) → renders one prop, framed the same way
       every time (a three-quarter view from the front-right, the floor
       grid in 0.5m squares so scale reads at a glance).
     The page draws into a square canvas; the driver screenshots it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #2a2723; overflow: hidden; }
      canvas { display: block; }
      #label { position: absolute; left: 6px; bottom: 4px; color: #d8d0c0; font: 12px system-ui; text-shadow: 0 1px 2px #000; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/client/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="c" width="256" height="256"></canvas>
    <div id="label"></div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "/client/node_modules/three/examples/jsm/loaders/GLTFLoader.js";
      import { MeshoptDecoder } from "/client/node_modules/three/examples/jsm/libs/meshopt_decoder.module.js";
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(256, 256, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2a2723);
      scene.add(new THREE.HemisphereLight(0xfff4e0, 0x3a342c, 1.6));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(4, 8, 6);
      scene.add(sun);
      const back = new THREE.DirectionalLight(0x9fb4ff, 0.6);
      back.position.set(-6, 3, -5);
      scene.add(back);
      const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 500);
      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      let current = null;
      let grid = null;
      window.show = async (url, label) => {
        if (current) scene.remove(current);
        if (grid) scene.remove(grid);
        const g = await loader.loadAsync(url);
        current = g.scene;
        scene.add(current);
        const box = new THREE.Box3().setFromObject(current);
        const size = box.getSize(new THREE.Vector3());
        const centre = box.getCenter(new THREE.Vector3());
        const r = Math.max(size.x, size.y, size.z, 0.05);
        const cells = Math.max(2, Math.ceil(Math.max(size.x, size.z) / 0.5) + 2);
        grid = new THREE.GridHelper(cells * 0.5, cells, 0x6a6258, 0x46403a);
        scene.add(grid);
        const dist = (r / Math.tan((camera.fov * Math.PI) / 360)) * 0.95;
        camera.position.set(centre.x + dist * 0.62, centre.y + dist * 0.5, centre.z + dist * 0.72);
        camera.near = dist / 100;
        camera.far = dist * 20;
        camera.lookAt(centre);
        camera.updateProjectionMatrix();
        document.getElementById("label").textContent = label ?? "";
        renderer.render(scene, camera);
        return true;
      };
      window.ready = true;
    </script>
  </body>
</html>

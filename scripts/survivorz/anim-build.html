<!--
  SURVIVORZ: bakes a move BUILT IN CODE (scripts/survivorz/anim-recipes.js) onto one packed
  body. The base clip plays, the recipe adds its motion in world space each frame, and every
  animated bone's local rotation (plus the hips' position) is recorded into an ordinary clip —
  the same JSON shape retarget.html writes, so pack.mjs and the floor checks treat it like any
  other. Driven by scripts/survivorz/anim-build.cjs.
  ?body=/assets/downloads/survivorz/game/eric.glb
  window.build.bake(recipe, fps) -> AnimationClip JSON
-->

  { "imports": {

        const v = tr.values, k = tr.times.length, q = (i) => new THREE.Quaternion(v[i * 4], v[i * 4 + 1], v[i * 4 + 2], v[i * 4 + 3]);
        const was = b.quaternion.clone();
        for (let i = 0; i < k; i++) {
          b.quaternion.copy(q(i)); const jv = jointVec(b); let moved = false;
          for (const c of ["x", "y", "z"]) { const r = NAT.range[`j:${key}:${c}`]; if (!r) continue; if (jv[c] < r[0] - SLACK) { jv[c] = r[0] - SLACK + 0.5; moved = true; } else if (jv[c] > r[1] + SLACK) { jv[c] = r[1] + SLACK - 0.5; moved = true; } }   // (held half a degree inside the line, or the check reads the edge as past it)
          if (moved) { setJointVec(b, jv); b.quaternion.toArray(v, i * 4); clamped++; }
        }
        b.quaternion.copy(was);
        if (k < 4) continue;
        const ang = (a, c) => 2 * Math.acos(Math.min(1, Math.abs(a.dot(c)))) * 180 / Math.PI;
        const vel = []; for (let i = 0; i < k - 1; i++) vel.push(ang(q(i), q(i + 1)) / Math.max(1e-3, tr.times[i + 1] - tr.times[i]));
        const acc = []; for (let i = 1; i < k - 1; i++) acc.push(Math.abs(vel[i] - vel[i - 1]));
        const med = [...acc].sort((x, y) => x - y)[acc.length >> 1] ?? 0;
        for (let i = 1; i < k - 1; i++) {
          const a = q(i - 1), c = q(i + 1); if (c.dot(a) < 0) c.set(-c.x, -c.y, -c.z, -c.w);
          const mid = a.clone().slerp(c, (tr.times[i] - tr.times[i - 1]) / (tr.times[i + 1] - tr.times[i - 1]));
          if (acc[i - 1] > Math.max(300, 4 * med) && ang(q(i), mid) > 10) { mid.toArray(v, i * 4); popped++; }
        }
      }
      j.cleaned = 4;   // the version: 1 ran against baselines without the every-joint measures, 2 missed long bone names, 3 missed the zombies' names
      return { clamped, popped };
    };
    NAT = await fetch(`/assets/downloads/survivorz/anim/${bodyId}/natural-base.json`).then((r) => r.ok ? r.json() : null).catch(() => null);
    B.ready = true;
  } catch (e) { B.error = String(e && e.stack || e); B.ready = true; }
</script>

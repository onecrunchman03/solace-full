<!doctype html>
<!--
  SURVIVORZ EFFECTS BENCH (docs/survivorz/EFFECTS.md §4). One scenario at a time,
  rendered on a FIXED clock (fx.update(1/fps) per frame, never real time), so a
  slow machine makes the same video; scripts/survivorz/fx-bench.mjs drives it.

  A plain grey room: a floor and two walls with a half-metre grid (so scale and
  where a mark lands are readable), a survivor standing for scale, dim facility
  light so a flame or a flash actually lights the room. The engine is the SHIPPED
  one (client/src/survivorz/fx), bundled by fx-bench.mjs — never a copy.

  ?scenario=fire&w=960&h=540
-->
<meta charset="utf-8" />
<script type="importmap">
  { "imports": {
      "three": "/client/node_modules/three/build/three.module.js",
      "three/addons/": "/client/node_modules/three/examples/jsm/",
      "three/examples/jsm/": "/client/node_modules/three/examples/jsm/" } }
</script>
<style>html,body{margin:0;background:#141517}canvas{display:block}</style>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
  import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
  import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
  import { FxSystem, effects, bulletHoleAtlas, findBone, findMouth, handAtMouth, barricade, playDoorEvent, slab, slabGeometry, woodLook, ShowFx, FxLedger, PROP_ANCHORS, tapOf, anchorOf, partsOf, panesOf } from "/assets/downloads/survivorz/fx/bench/fx.js";

  const q = new URLSearchParams(location.search);
  const W = Number(q.get("w") || 960), H = Number(q.get("h") || 540);
  const r = (window.r = { ready: false, error: null });
  try {
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(W, H); renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
    document.body.append(renderer.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x141517);
    // dim and cool, like a facility corridor on emergency light: an effect's own light must read
    const hemi = new THREE.HemisphereLight(0x8fa0b4, 0x2a2724, 1.25); scene.add(hemi);
    const key = new THREE.DirectionalLight(0xdfe8f2, 1.1); key.position.set(3, 6, 4); scene.add(key);
    // a torch, off unless a scenario wants one (always in the scene, so the light count never changes)
    const lamp = new THREE.PointLight(0xffe6c8, 0, 9, 2); scene.add(lamp);

    const gridTex = (() => {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      const g = c.getContext("2d"); g.fillStyle = "#6a6d71"; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = "#7d8186"; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
    })();
    const surf = (w, h) => { const t = gridTex.clone(); t.needsUpdate = true; t.repeat.set(w * 2, h * 2); return new THREE.MeshStandardMaterial({ map: t, roughness: 0.92 }); };
    // the room: 10 m deep, 8 wide, 4 high; tessellated so a decal projects cleanly
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 10, 16, 20), surf(8, 10));
    floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -2); scene.add(floor);
    const back = new THREE.Mesh(new THREE.PlaneGeometry(8, 4, 16, 8), surf(8, 4));
    back.position.set(0, 2, -7); scene.add(back);
    const side = new THREE.Mesh(new THREE.PlaneGeometry(10, 4, 20, 8), surf(10, 4));
    side.rotation.y = Math.PI / 2; side.position.set(-4, 2, -2); scene.add(side);
    // (named, as the world names its surfaces: a mark on one is written down by its name)
    floor.userData.fxId = "bench-floor"; back.userData.fxId = "bench-back"; side.userData.fxId = "bench-side";
    // F4: a facility corner — six ceiling panels in three banks, a lockdown beacon, a leaking
    // pipe, a puddle, a specimen tank. Hidden unless a scene wants it; its LIGHTS are always in
    // the scene at intensity 0, so the light count never changes (the hall's rule)
    const f4 = new THREE.Group(); f4.visible = false; scene.add(f4);
    const panelLights = [], panelMats = [];
    for (let i = 0; i < 6; i++) {
      const x = -2.4 + (i % 3) * 2.2, z = i < 3 ? -2.6 : -5.4;
      const mat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xfff3dc, emissiveIntensity: 0, roughness: 0.5 });
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.35), mat);
      panel.position.set(x, 3.97, z); f4.add(panel);
      const l = new THREE.PointLight(0xfff1d6, 0, 7, 2); l.position.set(x, 3.75, z); scene.add(l);
      panelLights.push(l); panelMats.push(mat);
    }
    const beaconMat = new THREE.MeshStandardMaterial({ color: 0x400000, emissive: 0xff2010, emissiveIntensity: 0 });
    const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.18, 16), beaconMat);
    beacon.position.set(-3.85, 3.3, -4.2); f4.add(beacon);
    const beaconLight = new THREE.PointLight(0xff2010, 0, 12, 2); beaconLight.position.set(-3.6, 3.3, -4.2); scene.add(beaconLight);
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 9, 16), new THREE.MeshStandardMaterial({ color: 0x5c615f, metalness: 0.4, roughness: 0.5 }));
    pipe.rotation.x = Math.PI / 2; pipe.position.set(-3.85, 2.4, -2.5); f4.add(pipe);
    const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.75, 48), new THREE.MeshStandardMaterial({ color: 0x4a5258, roughness: 0.28, metalness: 0.0 }));
    puddle.rotation.x = -Math.PI / 2; puddle.position.set(0.4, 0.004, -4.4); f4.add(puddle);
    const tank = new THREE.Group(); tank.position.set(1.6, 0, -5.2); f4.add(tank);
    tank.add(new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 2.2, 32, 1, true).translate(0, 1.1, 0), new THREE.MeshStandardMaterial({ color: 0xc8e0dc, roughness: 0.05, transparent: true, opacity: 0.18, side: THREE.DoubleSide, forceSinglePass: true, depthWrite: false })));
    tank.add(new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 2, 32).translate(0, 1, 0), new THREE.MeshStandardMaterial({ color: 0x0c2a1c, emissive: 0x1d6a46, emissiveIntensity: 0.6, roughness: 0.2, transparent: true, opacity: 0.55, forceSinglePass: true, depthWrite: false })));
    tank.add(new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.62, 0.15, 32).translate(0, 0.075, 0), new THREE.MeshStandardMaterial({ color: 0x3a3f3e, metalness: 0.5, roughness: 0.4 })));
    // a broken panel on the wall with its wiring hanging out
    const wirePanel = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x484c4a, roughness: 0.6 }));
    wirePanel.position.set(-3.97, 3.1, -4); f4.add(wirePanel);
    for (const [dz, len, tilt] of [[-0.06, 0.32, 0.25], [0.04, 0.22, -0.2], [0.1, 0.28, 0.1]]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, len, 6).translate(0, -len / 2, 0), new THREE.MeshStandardMaterial({ color: [0xb02020, 0x202020, 0xd0b020][Math.round(dz * 10 + 1) % 3], roughness: 0.6 }));
      w.position.set(-3.93, 3.0, -4 + dz); w.rotation.z = tilt; f4.add(w);
    }
    const tankLight = new THREE.PointLight(0x58e0a0, 0, 5, 2); tankLight.position.set(1.6, 1.2, -5.2); scene.add(tankLight);
    // two emergency units (battery twin-heads) high on the walls: dark until the power goes
    const emerMats = [], emerLights = [];
    for (const [x, z, ry] of [[-3.92, -1.6, Math.PI / 2], [1.4, -6.92, 0]]) {
      const unit = new THREE.Group(); unit.position.set(x, 3.05, z); unit.rotation.y = ry; f4.add(unit);
      unit.add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.12, 0.08), new THREE.MeshStandardMaterial({ color: 0xd8d6cf, roughness: 0.6 })));
      const m = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xfff0d8, emissiveIntensity: 0, roughness: 0.4 });
      for (const sx of [-0.11, 0.11]) { const h = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.07, 16).rotateX(Math.PI / 2), m); h.position.set(sx, -0.07, 0.07); unit.add(h); }
      const l = new THREE.PointLight(0xfff0d8, 0, 8, 2); l.position.set(x + (ry ? 0.25 : 0), 2.9, z + (ry ? 0 : 0.25)); scene.add(l);
      emerMats.push(m); emerLights.push(l);
    }
    // two flashlights' own lights (the world's, handed to the effects to drive)
    const torchLights = [0, 1].map(() => { const l = new THREE.SpotLight(0xfff4e2, 0, 14, 0.42, 0.45, 1.6); scene.add(l, l.target); return l; });
    const f4Lights = [...panelLights, beaconLight, tankLight, ...emerLights, ...torchLights];
    // a safe room's sink: a white basin on a stand, a tap over it (hidden unless a scene wants it)
    const sink = new THREE.Group(); sink.visible = false; scene.add(sink);
    {
      const porcelain = new THREE.MeshStandardMaterial({ color: 0xd8d6d0, roughness: 0.25 }), steel = new THREE.MeshStandardMaterial({ color: 0x9aa2a6, metalness: 0.7, roughness: 0.3 });
      const at = (m, x, y, z) => { m.position.set(x, y, z); sink.add(m); return m; };
      at(new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.04, 0.42), porcelain), 0, 0.8, 0);
      for (const [w, d, x, z] of [[0.56, 0.03, 0, 0.195], [0.56, 0.03, 0, -0.195], [0.03, 0.42, 0.265, 0], [0.03, 0.42, -0.265, 0]]) at(new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, d), porcelain), x, 0.9, z);
      at(new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.012, 0.3), new THREE.MeshStandardMaterial({ color: 0x5c6e78, roughness: 0.05, metalness: 0.1 })), 0, 0.83, 0.02);
      at(new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.22, 12), steel), 0, 1.06, -0.17);
      const spout = at(new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.14, 12), steel), 0, 1.16, -0.11); spout.rotation.x = Math.PI / 2;
      at(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.78, 12), porcelain), 0, 0.39, -0.08);
    }
    // a molotov: a green bottle with a rag in its neck (hidden unless a scene wants it)
    const bottle = new THREE.Group(); bottle.visible = false; scene.add(bottle);
    bottle.add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.038, 0.2, 16).translate(0, 0.1, 0), new THREE.MeshStandardMaterial({ color: 0x2f5a2a, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.8, forceSinglePass: true })));
    bottle.add(new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.03, 0.08, 12).translate(0, 0.24, 0), new THREE.MeshStandardMaterial({ color: 0x2f5a2a, roughness: 0.15, transparent: true, opacity: 0.8, forceSinglePass: true })));
    bottle.add(new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.07, 8).translate(0, 0.3, 0), new THREE.MeshStandardMaterial({ color: 0xc9b89a, roughness: 0.9 })));
    // a fixture's "fully on" before the effects take it over
    const lightUp = (idx) => { for (const i of idx) { panelLights[i].intensity = 7; panelMats[i].emissiveIntensity = 2.2; } };
    const fixturesUp = (idx, opts = {}) => {
      lightUp(idx);
      for (const i of idx) {
        const beam = fx.beams.add({ pos: panelLights[i].position.clone().setY(3.93), dir: P(0, -1, 0), length: 3.9, angle: 0.5, color: 0xfff1d6, intensity: 0.8, floorY: 0 });
        fx.fixtures.add({ id: `panel-${i}`, zone: "lobby", bank: i % 3, light: panelLights[i], emissive: [panelMats[i]], beam, style: (opts.styles ?? {})[i] ?? "buzz" });
        if (opts.dust !== false) fx.emit(effects.beamDust({ beam, count: 22 }), 900 + i);
      }
    };
    // a ceiling, only for the scenes that need one (smoke spreading under it, dust shaken off it)
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(8, 10), surf(8, 10));
    ceiling.rotation.x = Math.PI / 2; ceiling.position.set(0, 4, -2); ceiling.visible = false; scene.add(ceiling);

    // a survivor for scale (first frame of the idle; nothing animates on the bench)
    try {
      const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
      const gltf = await loader.loadAsync("/assets/downloads/survivorz/game/eric.glb");
      const body = (window.__body = gltf.scene); body.position.set(1.6, 0, -4.2); body.rotation.y = -0.5;
      const idle = gltf.animations.find((a) => /idle/i.test(a.name)) ?? gltf.animations[0];
      if (idle) { const m = new THREE.AnimationMixer(body); m.clipAction(idle).play(); m.setTime(0.5); }
      body.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
      scene.add(body);
    } catch (e) { console.warn("no reference body", e); }

    // F1: the three guns on a stand, and a row of things to shoot
    const guns = {};
    {
      const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
      for (const id of ["pistol", "hk416", "shotgun"]) {
        const g = (await loader.loadAsync(`/assets/downloads/survivorz/props/guns/${id}.glb`)).scene;
        g.visible = false; scene.add(g); guns[id] = g;
      }
    }
    const metal = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.03, 8, 8, 1), new THREE.MeshStandardMaterial({ color: 0x5a6670, metalness: 0.5, roughness: 0.45 }));
    metal.position.set(-0.95, 1.1, -6.2); scene.add(metal);
    const wood = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.04, 8, 8, 1), new THREE.MeshStandardMaterial({ color: 0x8a6440, roughness: 0.8 }));
    wood.position.set(-0.1, 1.1, -6.2); scene.add(wood);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.01, 8, 8, 1), new THREE.MeshStandardMaterial({ color: 0xbfd8e0, roughness: 0.05, transparent: true, opacity: 0.25 }));
    glass.position.set(0.75, 1.1, -6.2); scene.add(glass);
    const targets = [metal, wood, glass];
    for (const t of targets) t.visible = false;

    const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 80);
    const tl = new THREE.TextureLoader();
    // ?png=1 skips the compressed sheets, to compare memory and look against the PNGs
    const gltfLoader = new GLTFLoader(); gltfLoader.setMeshoptDecoder(MeshoptDecoder);
    const ktx = q.get("png") ? null : new KTX2Loader().setTranscoderPath("/client/node_modules/three/examples/jsm/libs/basis/").detectSupport(renderer);
    const fx = new FxSystem({
      scene, camera, renderer,
      load: {
        texture: (p, space) => tl.loadAsync(`/assets/downloads/survivorz/fx/${p}`).then((t) => { t.colorSpace = space === "srgb" ? THREE.SRGBColorSpace : THREE.NoColorSpace; return t; }),
        json: (p) => fetch(`/assets/downloads/survivorz/fx/${p}`).then((x) => x.json()),
        model: (p) => gltfLoader.loadAsync(`/assets/downloads/survivorz/fx/${p}`).then((g) => g.scene),
        ...(ktx ? { compressed: (p) => ktx.loadAsync(`/assets/downloads/survivorz/fx/${p}`) } : {}),
      },
    });
    await fx.load();
    await fx.loadBlood();
    await fx.loadScorch();
    const kit = await fx.loadBreaking();
    await fx.loadHoles();
    fx.surfaces.push(floor, back, side, metal, wood, glass);
    // F6: a partition across the room with a doorway in it (0.9 x 2.1, the facility's
    // ordinary door), and three leaves for it: painted wood, steel, and a glass door.
    // The door faces +z (from room a, behind it, into room b, the camera's side); the blows
    // come from behind, so the debris comes toward the camera. Hidden unless a scene wants it.
    const f6 = new THREE.Group(); f6.visible = false; scene.add(f6);
    const DOOR = { at: new THREE.Vector3(0, 1.05, -4.6), normal: new THREE.Vector3(0, 0, 1), size: [0.9, 2.1] };
    const wallMat = surf(8, 4);
    const wallPart = (w, h, x, y) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2, Math.ceil(w * 2), Math.ceil(h * 2), 1), wallMat); m.position.set(x, y, -4.6); f6.add(m); return m; };
    const walls = [wallPart(3.5, 4, -2.25, 2), wallPart(3.5, 4, 2.25, 2), wallPart(1, 1.85, 0, 3.075)];
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x4c4f52, roughness: 0.55, metalness: 0.3 });
    for (const x of [-0.475, 0.475]) { const j = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.15, 0.24), frameMat); j.position.set(x, 1.075, -4.6); f6.add(j); }
    { const l = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 0.24), frameMat); l.position.set(0, 2.125, -4.6); f6.add(l); }
    const rect = [[-0.45, -1.05], [0.45, -1.05], [0.45, 1.05], [-0.45, 1.05]];
    const woodLeaf = new THREE.Mesh(slabGeometry(slab(rect, 0.044, woodLook(kit, "painted", "y", [0.9, 0.88, 0.85]))), kit.wood);
    woodLeaf.position.copy(DOOR.at); f6.add(woodLeaf);
    const steelLeaf = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.1, 0.05), new THREE.MeshStandardMaterial({ color: 0x7c868c, metalness: 0.25, roughness: 0.5 }));
    steelLeaf.position.copy(DOOR.at); f6.add(steelLeaf);
    // the glass door: a thin steel frame round a pane
    const glassLeaf = new THREE.Group(); glassLeaf.position.copy(DOOR.at); f6.add(glassLeaf);
    for (const [w, h, x, y] of [[0.06, 2.1, -0.42, 0], [0.06, 2.1, 0.42, 0], [0.9, 0.06, 0, 1.02], [0.9, 0.12, 0, -0.99]]) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), frameMat); b.position.set(x, y, 0); glassLeaf.add(b);
    }
    const pane = new THREE.Mesh(new THREE.BoxGeometry(0.78, 1.92, 0.008, 4, 8, 1), new THREE.MeshStandardMaterial({ color: 0xcfe2e4, roughness: 0.04, metalness: 0.1, transparent: true, opacity: 0.3, forceSinglePass: true, depthWrite: false }));
    pane.position.set(0, -0.03, 0); glassLeaf.add(pane);
    let planks = [], plankGroup = null;
    const doorSet = (leaf, nPlanks = 0, reinforced = false) => {
      f6.visible = true;
      for (const l of [woodLeaf, steelLeaf, glassLeaf]) l.visible = l === leaf;
      pane.visible = true;
      if (plankGroup) { f6.remove(plankGroup); plankGroup = null; }
      planks = [];
      if (nPlanks) {
        plankGroup = barricade(kit, { ...DOOR, side: 1, reinforced }, nPlanks, 4242);
        f6.add(plankGroup); planks = [...plankGroup.children];
      }
    };
    // F7: THE WORST MOMENT, in a blockout of the facility's busiest real room: Reception in the
    // Vault Lobby, 30 x 12 m at its own place on the map (x 40-70, z 20-32), 4 m high, with
    // its three real doorways from SITE_9: the doorway north to the Vault Chamber (55, z 20),
    // the doorway east to the Security Desk (x 70, 26), and the wooden door south to
    // Decontamination (55, z 32), barricaded. Six ceiling panels in three banks. The real set
    // replaces all of this when it lands (F7 proper).
    const f7 = new THREE.Group(); f7.visible = false; scene.add(f7);
    const recMat = surf(30, 12);
    const recBox = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d, Math.max(1, Math.ceil(w)), Math.max(1, Math.ceil(h)), Math.max(1, Math.ceil(d))), recMat); m.position.set(x, y, z); f7.add(m); return m; };
    const recFloor = new THREE.Mesh(new THREE.PlaneGeometry(30, 12, 30, 12), recMat); recFloor.rotation.x = -Math.PI / 2; recFloor.position.set(55, 0, 26); f7.add(recFloor);
    const recCeil = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), recMat); recCeil.rotation.x = Math.PI / 2; recCeil.position.set(55, 4, 26); f7.add(recCeil);
    const recWalls = [
      // north (z 20): the Vault Chamber doorway, 1.6 x 2.4 at x 55
      recBox(14.2, 4, 0.2, 47.1, 2, 20), recBox(14.2, 4, 0.2, 62.9, 2, 20), recBox(1.6, 1.6, 0.2, 55, 3.2, 20),
      // south (z 32): the Decontamination door, 0.9 x 2.1 at x 55
      recBox(14.55, 4, 0.2, 47.275, 2, 32), recBox(14.55, 4, 0.2, 62.725, 2, 32), recBox(0.9, 1.9, 0.2, 55, 3.05, 32),
      // east (x 70): the Security Desk doorway, 1.6 x 2.4 at z 26
      recBox(0.2, 4, 5.2, 70, 2, 22.6), recBox(0.2, 4, 5.2, 70, 2, 29.4), recBox(0.2, 1.6, 1.6, 70, 3.2, 26),
      // west (x 40): solid
      recBox(0.2, 4, 12, 40, 2, 26),
    ];
    const recLeaf = new THREE.Mesh(slabGeometry(slab(rect, 0.044, woodLook(kit, "painted", "y", [0.9, 0.88, 0.85]))), kit.wood);
    recLeaf.position.set(55, 1.05, 32); f7.add(recLeaf);
    const recLights = [], recMats = [];
    for (let i = 0; i < 6; i++) {
      const x = 46 + (i % 3) * 9, z = i < 3 ? 23.5 : 28.5;
      const mat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xfff3dc, emissiveIntensity: 0, roughness: 0.5 });
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.35), mat); panel.position.set(x, 3.97, z); f7.add(panel);
      const l = new THREE.PointLight(0xfff1d6, 0, 10, 2); l.position.set(x, 3.75, z); scene.add(l);
      recLights.push(l); recMats.push(mat);
    }
    const recPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 12, 16), new THREE.MeshStandardMaterial({ color: 0x5c615f, metalness: 0.4, roughness: 0.5 }));
    recPipe.rotation.x = Math.PI / 2; recPipe.position.set(40.4, 3.4, 26); f7.add(recPipe);
    // one blow from behind the door, as the server sends it

    const tq = gl.getExtension("EXT_disjoint_timer_query_webgl2");
    const timeRender = async (n) => {
      if (!tq) return null;
      const qs = [];
      for (let i = 0; i < n; i++) { const qq = gl.createQuery(); gl.beginQuery(tq.TIME_ELAPSED_EXT, qq); renderer.render(scene, camera); gl.endQuery(tq.TIME_ELAPSED_EXT); qs.push(qq); }
      let total = 0, got = 0;
      for (const qq of qs) {
        for (let tries = 0; tries < 200 && !gl.getQueryParameter(qq, gl.QUERY_RESULT_AVAILABLE); tries++) await new Promise((res) => setTimeout(res, 5));
        if (gl.getParameter(tq.GPU_DISJOINT_EXT)) continue;
        total += gl.getQueryParameter(qq, gl.QUERY_RESULT); got++;
      }
      return got ? total / got / 1e6 : null;
    };
    r.cost = async (n = 20) => {
      const on = await timeRender(n);
      fx.root.visible = false;
      const off = await timeRender(n);
      fx.root.visible = true;
      renderer.info.reset();
      renderer.render(scene, camera);
      return { gpuMsWith: on, gpuMsWithout: off, fxMs: on != null && off != null ? on - off : null, calls: renderer.info.render.calls, stats: fx.stats(), gpu: (() => { const d = gl.getExtension("WEBGL_debug_renderer_info"); return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); })() };
    };
    r.fx = fx; r.THREE = THREE; r.guns = guns; r.freshSurvivor = freshSurvivor; r.findMouth = findMouth; r.survivorSrc = survivorSrc; r.gltfLoader = gltfLoader; r.extras = () => extras; r.cast = () => cast;
    r.ready = true;
  } catch (e) {
    r.error = String(e?.stack ?? e);
  }
</script>

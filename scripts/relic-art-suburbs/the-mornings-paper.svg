<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="0.22" stop-color="#f3ecdb"/>
      <stop offset="0.6" stop-color="#ddd3bc"/>
      <stop offset="0.88" stop-color="#b3a88f"/>
      <stop offset="1" stop-color="#8f8570"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.24" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#5a4e38" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a4e38" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="endface" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#cfc5ad"/>
      <stop offset="1" stop-color="#efe8d6"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e2416"/>
      <stop offset="0.45" stop-color="#d4553a"/>
      <stop offset="0.7" stop-color="#e98366"/>
      <stop offset="1" stop-color="#8a2a1a"/>
    </linearGradient>
    <clipPath id="body">
      <path d="M86 200 L430 200 A32 55 0 0 1 430 310 L86 310 A32 55 0 0 1 86 200 Z"/>
    </clipPath>
  </defs>

  <g transform="rotate(-20 256 256)">
    <!-- the roll -->
    <path d="M86 200 L430 200 A32 55 0 0 1 430 310 L86 310 A32 55 0 0 1 86 200 Z" fill="url(#roll)"/>
    <g clip-path="url(#body)">
      <!-- newsprint, squeezed toward the edges like print round a curve -->
      <g fill="#3c362c">
        <text x="118" y="246" font-family="Georgia, serif" font-weight="bold" font-size="30" transform="translate(0 246) scale(1 0.92) translate(0 -246)">The Morning Courier</text>
      </g>
      <rect x="114" y="252" width="300" height="2.5" fill="#4a4336" opacity="0.8"/>
      <rect x="114" y="257" width="300" height="1" fill="#4a4336" opacity="0.6"/>
      <text x="118" y="276" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#3c362c">BAKE SALE SATURDAY</text>
      <g fill="#8a8170" opacity="0.85">
        <rect x="118" y="283" width="120" height="3"/>
        <rect x="118" y="290" width="112" height="3"/>
        <rect x="118" y="297" width="118" height="3"/>
        <rect x="118" y="304" width="100" height="2.5"/>
        <rect x="248" y="266" width="64" height="40" fill="#b6ad98"/>
        <rect x="322" y="266" width="90" height="3"/>
        <rect x="322" y="273" width="86" height="3"/>
        <rect x="322" y="280" width="90" height="3"/>
        <rect x="322" y="287" width="80" height="3"/>
        <rect x="322" y="294" width="88" height="3"/>
        <rect x="322" y="301" width="84" height="2.5"/>
        <rect x="118" y="214" width="296" height="2" opacity="0.6"/>
        <rect x="118" y="208" width="200" height="2" opacity="0.4"/>
      </g>
      <!-- curvature light and shadow over the print -->
      <rect x="40" y="200" width="420" height="110" fill="url(#shade)"/>
      <!-- the free edge of the outer sheet -->
      <path d="M60 292 L440 292" stroke="#fffaf0" stroke-width="2.2" opacity="0.8"/>
      <path d="M60 294.5 L440 294.5" stroke="#6e6452" stroke-width="1.6" opacity="0.6"/>
    </g>

    <!-- the open end, showing the turns of paper -->
    <ellipse cx="430" cy="255" rx="32" ry="55" fill="url(#endface)"/>
    <g fill="none" stroke="#a49a82" stroke-width="1.8">
      <ellipse cx="431" cy="256" rx="26" ry="46"/>
      <ellipse cx="432" cy="257" rx="20" ry="37"/>
      <ellipse cx="433" cy="258" rx="14" ry="27"/>
      <ellipse cx="434" cy="259" rx="8" ry="17"/>
    </g>
    <ellipse cx="435" cy="260" rx="4" ry="9" fill="#5e5644"/>
    <ellipse cx="430" cy="255" rx="32" ry="55" fill="none" stroke="#fffaf0" stroke-width="2.5" opacity="0.9"/>

    <!-- the rubber band, pinching the roll -->
    <path d="M243 196 A30 59 0 0 1 243 314" fill="none" stroke="#3a1a10" stroke-width="20" opacity="0.28"/>
    <path d="M250 198 A30 57 0 0 1 250 312" fill="none" stroke="url(#band)" stroke-width="15" stroke-linecap="butt"/>
    <path d="M254 200 A28 56 0 0 1 270 236" fill="none" stroke="#ffc2ae" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
    
  </g>
</svg>

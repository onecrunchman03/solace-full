      <stop offset="1" stop-color="#b9b2a8"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#5e9be0"/>
      <stop offset="0.4" stop-color="#2f6cc0"/>
      <stop offset="1" stop-color="#173c7c"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ad6"/>
      <stop offset="1" stop-color="#1d4892"/>
    </linearGradient>
    <linearGradient id="trouser" x1="0" x2="1">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" width="512" height="560">
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ff6a52"/>
      <stop offset="0.35" stop-color="#e2321f"/>
      <stop offset="0.8" stop-color="#a81810"/>
      <stop offset="1" stop-color="#7a0e08"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe0c4"/>
      <stop offset="0.6" stop-color="#f4b48c"/>
      <stop offset="1" stop-color="#cf8661"/>
    </radialGradient>
    <radialGradient id="nose" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffc6aa"/>
      <stop offset="0.6" stop-color="#ec8f74"/>
      <stop offset="1" stop-color="#c0624c"/>
    </radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="1" y2="1">

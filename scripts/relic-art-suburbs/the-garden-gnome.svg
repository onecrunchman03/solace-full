      <stop offset="1" stop-color="#8e6416"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c486"/>
      <stop offset="1" stop-color="#9a6e34"/>

  <path d="M196 304 C176 330 178 370 214 396 C234 408 258 404 272 396 L264 372 C244 378 226 372 220 352 C216 336 218 320 226 308 Z" fill="url(#sleeve)" stroke="#10305e" stroke-width="2.5"/>
  <path d="M304 304 C326 320 336 342 330 362 L312 362 C312 344 302 326 286 314 Z" fill="url(#sleeve)" stroke="#10305e" stroke-width="2.5"/>
  <circle cx="282" cy="398" r="17" fill="url(#skin)"/>
  <circle cx="320" cy="356" r="15" fill="url(#skin)"/>

  <!-- beard -->
  <path d="M184 248 C172 300 188 350 222 386 C236 400 246 410 252 424 C258 410 270 398 284 384 C316 350 324 300 310 248 C292 272 274 282 248 282 C222 282 202 272 184 248 Z" fill="url(#beard)"/>
  <path d="M206 300 C210 330 226 356 240 376 M250 296 C248 330 250 360 252 400 M290 300 C286 330 274 356 264 376 M222 290 C224 312 232 334 242 350 M276 290 C272 312 264 334 256 350" fill="none" stroke="#bdb6aa" stroke-width="2.4" stroke-linecap="round"/>

  <!-- face -->
  <ellipse cx="190" cy="246" rx="11" ry="16" fill="url(#skin)"/>
  <ellipse cx="306" cy="246" rx="11" ry="16" fill="url(#skin)"/>
  <ellipse cx="248" cy="246" rx="60" ry="44" fill="url(#skin)"/>
  <circle cx="214" cy="258" r="14" fill="#ff7f7a" fill-opacity="0.45"/>
  <circle cx="284" cy="258" r="14" fill="#ff7f7a" fill-opacity="0.45"/>
  <!-- eyes and brows -->
  <ellipse cx="227" cy="240" rx="5.5" ry="6.5" fill="#3a2414"/>
  <ellipse cx="270" cy="240" rx="5.5" ry="6.5" fill="#3a2414"/>
  <circle cx="229" cy="238" r="2" fill="#ffffff"/>
  <circle cx="272" cy="238" r="2" fill="#ffffff"/>
  <path d="M212 228 Q226 216 240 226" stroke="#f4f0ea" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M256 226 Q270 216 286 228" stroke="#f4f0ea" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- moustache and nose -->
  <path d="M204 272 C218 258 238 260 248 272 C258 260 278 258 292 272 C282 292 258 288 248 280 C238 288 214 292 204 272 Z" fill="url(#beard)"/>
  <ellipse cx="248" cy="260" rx="17" ry="15" fill="url(#nose)"/>
  <ellipse cx="242" cy="254" rx="5" ry="4" fill="#ffffff" fill-opacity="0.55"/>

  <!-- hat -->
  <g transform="translate(0 -24)">
  <path d="M146 226 C160 172 190 112 214 62 C222 46 238 40 246 54 C264 102 302 170 346 226 Q250 248 146 226 Z" fill="url(#hat)"/>
  <path d="M146 226 Q250 248 346 226 L344 236 Q250 258 148 236 Z" fill="#8a120a"/>
  <path d="M196 120 C186 150 176 180 170 210" stroke="#ff9a86" stroke-opacity="0.7" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M220 66 C214 78 206 96 200 110" stroke="#ffb4a4" stroke-opacity="0.8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- the chip out of the hat -->
  <path d="M298 190 L306 183 L313 187 L321 180 L331 186 L330 194 L337 202 L328 209 L318 205 L309 211 L301 202 Z" fill="url(#clay)"/>
  <path d="M301 202 L298 190 L306 183 L313 187 L321 180 L331 186" fill="none" stroke="#5e2410" stroke-width="2.8" stroke-linejoin="round" opacity="0.85"/>
  <path d="M330 194 L337 202 L328 209 L318 205 L309 211" fill="none" stroke="#ffe6d2" stroke-width="2" stroke-linejoin="round"/>
  <path d="M308 194 L318 191 L326 197" fill="none" stroke="#a5532e" stroke-width="1.6" opacity="0.8"/>

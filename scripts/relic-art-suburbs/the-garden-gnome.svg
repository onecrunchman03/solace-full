  <ellipse cx="250" cy="504" rx="128" ry="25" fill="url(#base)"/>
  <path d="M138 500 q6 -16 10 0 q5 -14 9 0 q6 -18 10 0 M330 496 q5 -14 9 0 q6 -18 10 0 q4 -12 8 0 M200 516 q5 -12 8 0 q5 -14 9 0" fill="#6fae3e" stroke="#4e8a2a" stroke-width="2"/>

  <!-- boots -->
  <path d="M176 500 C176 478 196 470 222 472 C238 474 246 484 246 498 C222 506 196 508 176 500 Z" fill="url(#boot)"/>
  <path d="M254 498 C254 484 262 474 280 472 C306 470 326 480 328 500 C306 508 280 506 254 498 Z" fill="url(#boot)"/>
  <!-- a chipped toe -->
  <path d="M181 494 L185 487 L192 485 L197 490 L194 498 L186 500 Z" fill="url(#clay)"/><path d="M181 494 L185 487 L192 485" fill="none" stroke="#6e2e12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><path d="M197 490 L194 498 L186 500" fill="none" stroke="#ffe6d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>


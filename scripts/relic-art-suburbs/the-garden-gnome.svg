      <stop offset="1" stop-color="#245a20"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#9a6436"/>
      <stop offset="1" stop-color="#4e2c12"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2c"/>
      <stop offset="1" stop-color="#4a2c10"/>

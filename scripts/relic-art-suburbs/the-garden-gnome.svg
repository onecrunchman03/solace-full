  <path d="M256 444 L304 444 L300 482 L258 482 Z" fill="url(#trouser)"/>

  <!-- fishing line and float, behind everything at the right -->
  <path d="M470 120 C474 170 470 230 472 286" stroke="#e4e4e4" stroke-width="2" fill="none"/>
  <circle cx="472" cy="298" r="13" fill="#f4f1ea"/>
  <path d="M459 298 A13 13 0 0 1 485 298 Z" fill="#e8301e"/>
  <circle cx="467" cy="292" r="3.5" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="470" y="281" width="4" height="6" fill="#d9d2c4"/>

  <!-- coat -->
  <path d="M190 300 C170 340 156 400 150 452 Q250 472 350 452 C344 400 330 340 312 300 Q250 284 190 300 Z" fill="url(#coat)"/>
  <!-- a chip off the hem shows the terracotta -->
  <path d="M156 444 L161 434 L170 432 L177 438 L176 447 L166 451 Z" fill="url(#clay)"/><path d="M156 444 L161 434 L170 432" fill="none" stroke="#6e2e12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><path d="M177 438 L176 447 L166 451" fill="none" stroke="#ffe6d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- belt -->
  <path d="M164 398 Q250 414 336 398 L340 420 Q250 436 160 420 Z" fill="url(#belt)"/>
  <rect x="214" y="400" width="34" height="28" rx="4" fill="url(#gold)"/>
  <rect x="222" y="407" width="18" height="14" rx="2" fill="#4a2c10"/>

  <!-- rod (behind the hands) -->
  <path d="M244 446 L250 452 L474 116 L470 114 Z" fill="url(#rod)"/>
  <path d="M244 446 L254 452 L282 410 L272 404 Z" fill="#6e3a1c"/>
  <circle cx="300" cy="388" r="12" fill="#c8ccd2" stroke="#7a8088" stroke-width="3"/>
  <circle cx="296" cy="384" r="3" fill="#ffffff"/>


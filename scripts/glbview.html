<!doctype html>
<!-- GLB contact sheet — the casino sibling of animview.html. Serve the repo
     with `node scripts/serve-root.mjs`, then:
       http://localhost:8791/scripts/glbview.html?glb=/client/public/assets/casino/bar/bar_stool.glb
     Renders the file AS AUTHORED (museum layout), one name label per mesh,
     orthographic-ish high angle, auto-framed. window.__objects lists names
     with world bboxes for scripting. -->
<meta charset="utf-8" />
<style>body { margin: 0; background: #182028; } #tag { position: fixed; left: 8px; top: 8px; color: #9fb; font: 12px monospace; white-space: pre; }</style>
<div id="tag"></div>
<script type="importmap">
  { "imports": { "three": "/client/node_modules/three/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from "/client/node_modules/three/build/three.module.js";
  import { GLTFLoader } from "/client/node_modules/three/examples/jsm/loaders/GLTFLoader.js";

  const q = new URLSearchParams(location.search);
  const url = q.get("glb");
  const az = Number(q.get("az") ?? 0.7); // camera azimuth, radians
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x182028);
  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(3, 6, 2);
  scene.add(sun);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 500);

  const label = (text, pos) => {
    const c = document.createElement("canvas");
    const px = 28;
    const ctx = c.getContext("2d");
    ctx.font = `${px}px monospace`;
    c.width = ctx.measureText(text).width + 8;
    c.height = px + 8;
    const ctx2 = c.getContext("2d");
    ctx2.font = `${px}px monospace`;
    ctx2.fillStyle = "#0f0";
    ctx2.fillText(text, 4, px);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
    s.position.copy(pos);
    s.scale.set(c.width / 90, c.height / 90, 1);
    s.renderOrder = 99;
    return s;
  };

  new GLTFLoader().load(url, (g) => {
    scene.add(g.scene);
    g.scene.updateMatrixWorld(true);
    const objects = [];
    const all = new THREE.Box3();
    g.scene.traverse((o) => {
      if (!o.isMesh) return;
      const bb = new THREE.Box3().setFromObject(o);
      if (bb.isEmpty()) return;
      all.union(bb);
      const c = bb.getCenter(new THREE.Vector3());
      const s = bb.getSize(new THREE.Vector3());
      objects.push({ name: o.name, center: [c.x, c.y, c.z].map((v) => +v.toFixed(2)), size: [s.x, s.y, s.z].map((v) => +v.toFixed(2)) });
      if (q.get("labels") !== "0") scene.add(label(o.name, new THREE.Vector3(c.x, bb.max.y + 0.25, c.z)));
    });
    window.__objects = objects;
    const c = all.getCenter(new THREE.Vector3());
    const s = all.getSize(new THREE.Vector3());
    const r = Math.max(s.x, s.y, s.z);
    camera.position.set(c.x + Math.sin(az) * r * 1.1, c.y + r * 0.75, c.z + Math.cos(az) * r * 1.1);
    camera.lookAt(c);
    document.getElementById("tag").textContent = `${url}\n${objects.length} meshes, extent ${s.x.toFixed(1)} x ${s.y.toFixed(1)} x ${s.z.toFixed(1)}`;
    renderer.render(scene, camera);
    window.__ready = true;
    setInterval(() => renderer.render(scene, camera), 500);
  });
</script>

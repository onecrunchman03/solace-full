# systemd-tmpfiles entry for Solace: guarantees the data directory exists
# (with the right owner) before solace.service's sandbox is assembled —
# ReadWritePaths= on a missing path fails the unit with status=226/NAMESPACE.
#
# Install: sudo cp deploy/solace-tmpfiles.conf /etc/tmpfiles.d/solace.conf
#          sudo systemd-tmpfiles --create /etc/tmpfiles.d/solace.conf
# Runs automatically on every boot thereafter.
d /opt/solace/data 0750 solace solace -

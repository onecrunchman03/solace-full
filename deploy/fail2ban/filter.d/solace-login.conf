# Match refused sign-in attempts in Caddy's JSON access log.
#
# Caddy writes one JSON object per line (deploy/Caddyfile: `format json`), and
# the field order within it is stable but not guaranteed, so this matches on
# the three pieces independently rather than assuming a layout:
#   "client_ip":"<HOST>"   ... "uri":"/api/login..."   ... "status":401|429
#
# client_ip is the one to key on, NOT remote_ip: it is what Caddy resolved
# after its own trusted-proxy handling, the same value the app records in its
# sign-in ledger. Keying on anything a client can influence would let an
# attacker get a third party banned.
#
# /api/login covers /api/login and /api/login/verify. /api/reset-password is
# included because the recovery secret can replace a password, which makes
# guessing it a takeover path, not a nuisance.

[Definition]
failregex = ^.*"client_ip":"<HOST>".*"uri":"/api/(login|reset-password)[^"]*".*"status":(401|429)\b.*$
ignoreregex =

# Caddy timestamps are epoch floats ("ts":1786001925.19), which fail2ban's
# default date detectors don't recognise; without this every line looks like
# "now" and findtime stops meaning anything.
datepattern = "ts":{EPOCH}
